# ============================================================================
# IPTV Platform - Kubernetes Deployment
# ============================================================================
# Complete Kubernetes manifests for production deployment
# Usage: kubectl apply -f kubernetes/
# ============================================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: iptv-platform
  labels:
    name: iptv-platform

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: iptv-config
  namespace: iptv-platform
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "iptv_platform"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  API_URL: "https://api.iptv.example.com"
  CDN_BASE_URL: "https://cdn.iptv.example.com"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: iptv-secrets
  namespace: iptv-platform
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "your_root_password"
  MYSQL_PASSWORD: "your_db_password"
  JWT_SECRET: "your_jwt_secret_min_32_chars"
  STRIPE_SECRET_KEY: "your_stripe_key"

---
# MySQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: iptv-platform
spec:
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iptv-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: iptv-config
              key: DB_DATABASE
        - name: MYSQL_USER
          value: "iptv_user"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iptv-secrets
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mysql
            - -h
            - localhost
            - -u
            - root
            - -p${MYSQL_ROOT_PASSWORD}
            - -e
            - "SELECT 1"
          initialDelaySeconds: 30
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: iptv-platform
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mysql
  clusterIP: None

---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: iptv-platform
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: iptv-platform
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
  clusterIP: None

---
# Streaming Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-gateway
  namespace: iptv-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: streaming-gateway
  template:
    metadata:
      labels:
        app: streaming-gateway
    spec:
      containers:
      - name: streaming-gateway
        image: ghcr.io/your-org/iptv-platform-backend:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: websocket
        envFrom:
        - configMapRef:
            name: iptv-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iptv-secrets
              key: MYSQL_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: iptv-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: transcoded
          mountPath: /app/transcoded
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: transcoded
        persistentVolumeClaim:
          claimName: transcoded-pvc

---
# Streaming Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: streaming-gateway-service
  namespace: iptv-platform
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: websocket
  selector:
    app: streaming-gateway

---
# Admin Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: iptv-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
      - name: admin-dashboard
        image: ghcr.io/your-org/iptv-platform-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---
# Admin Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard-service
  namespace: iptv-platform
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: admin-dashboard

---
# Nginx Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iptv-ingress
  namespace: iptv-platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - iptv.example.com
    - api.iptv.example.com
    - admin.iptv.example.com
    secretName: iptv-tls
  rules:
  - host: api.iptv.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streaming-gateway-service
            port:
              number: 8080
  - host: admin.iptv.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard-service
            port:
              number: 80

---
# Horizontal Pod Autoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streaming-gateway-hpa
  namespace: iptv-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streaming-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# PersistentVolumeClaim for uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: iptv-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi

---
# PersistentVolumeClaim for transcoded content
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transcoded-pvc
  namespace: iptv-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
