apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iptv-platform-ingress
  namespace: iptv-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "realtime-ws"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - api.iptv-platform.com
    - ws.iptv-platform.com
    secretName: iptv-platform-tls
  rules:
  # API Gateway
  - host: api.iptv-platform.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8080
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: streaming-gateway
            port:
              number: 8000
  # WebSocket Server
  - host: ws.iptv-platform.com
    http:
      paths:
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: realtime-ws
            port:
              number: 8001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: realtime-ws
            port:
              number: 8001
