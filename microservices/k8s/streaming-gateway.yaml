apiVersion: v1
kind: Secret
metadata:
  name: streaming-secrets
  namespace: iptv-platform
type: Opaque
stringData:
  JWT_SECRET: "change_me_to_a_very_long_random_string_at_least_32_characters"
  DB_PASSWORD: "change_me_in_production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-gateway
  namespace: iptv-platform
  labels:
    app: streaming-gateway
spec:
  replicas: 5
  selector:
    matchLabels:
      app: streaming-gateway
  template:
    metadata:
      labels:
        app: streaming-gateway
    spec:
      containers:
      - name: streaming-gateway
        image: iptv-streaming-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HTTP_PORT
          value: "8000"
        - name: ENVIRONMENT
          value: "production"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "iptv_user"
        - name: DB_NAME
          value: "iptv_platform"
        - name: DB_SSLMODE
          value: "disable"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: JWT_SECRET
        - name: GEOIP_DATABASE_PATH
          value: "/usr/share/GeoIP/GeoLite2-City.mmdb"
        - name: SEGMENT_DURATION
          value: "10"
        - name: BUFFER_SIZE
          value: "8192"
        - name: MAX_BITRATE
          value: "8000000"
        - name: CDN_ENABLED
          value: "true"
        - name: CDN_BASE_URL
          value: "https://cdn.iptv-platform.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-gateway
  namespace: iptv-platform
spec:
  selector:
    app: streaming-gateway
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streaming-gateway-hpa
  namespace: iptv-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streaming-gateway
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
