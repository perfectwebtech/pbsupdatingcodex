apiVersion: v1
kind: Secret
metadata:
  name: realtime-secrets
  namespace: iptv-platform
type: Opaque
stringData:
  JWT_SECRET: "change_me_to_a_very_long_random_string_at_least_32_characters"
  DB_PASSWORD: "change_me_in_production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-ws
  namespace: iptv-platform
  labels:
    app: realtime-ws
spec:
  replicas: 5
  selector:
    matchLabels:
      app: realtime-ws
  template:
    metadata:
      labels:
        app: realtime-ws
    spec:
      containers:
      - name: realtime-ws
        image: iptv-realtime-ws:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: ws
        env:
        - name: PORT
          value: "8001"
        - name: HOST
          value: "0.0.0.0"
        - name: LOG_LEVEL
          value: "info"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "iptv_user"
        - name: DB_NAME
          value: "iptv_platform"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: realtime-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: realtime-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-ws
  namespace: iptv-platform
spec:
  selector:
    app: realtime-ws
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realtime-ws-hpa
  namespace: iptv-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realtime-ws
  minReplicas: 5
  maxReplicas: 30
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
