[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-recommendation"
version = "1.0.0"
description = "AI-powered recommendation engine for IPTV platform"
authors = [{name = "IPTV Platform Team"}]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "tensorflow==2.15.0",
    "torch==2.1.2",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
